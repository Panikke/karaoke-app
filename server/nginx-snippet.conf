# ─────────────────────────────────────────────────────────────────────────────
# Add these blocks inside your existing  server { ... }  block in nginx.
# On DietPi the site config is usually at:
#   /etc/nginx/sites-available/default   (or a file in sites-enabled/)
# After editing: nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

    # Raise upload limit for WAV files (per-request)
    client_max_body_size 500M;

    # Proxy /api/ requests to the Express server
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;   # large uploads can take a while
        proxy_send_timeout 600s;
        client_max_body_size 500M;
    }

    # Proxy /audio/ through Express — Express serves the files from AUDIO_DIR.
    # This is the simplest option; no need to know the Pi's filesystem layout in nginx.
    location /audio/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Alternative: serve audio files directly from the filesystem (faster) ──
    # Use this instead of the proxy above if you prefer nginx to serve files directly.
    # location /audio/ {
    #     alias   /var/www/karaoke-app/audio/;
    #     add_header Cache-Control "public, max-age=2592000";
    #     add_header Access-Control-Allow-Origin "*";
    # }
